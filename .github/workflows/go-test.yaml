name: Go test

# 머지 게이트 — 한 job에서 순차 실행한다:
#   ① 명세 신선도(재생성 diff) ② 빌드 ③ 전체 go test
# 앞 step이 실패하면 뒤는 실행되지 않는다 (freshness 깨짐 → test 생략).
# 테스트는 fake 기반이라 실 업스트림 불필요, test.env 없이 돈다(make test의 더미 기본값).
# 근거: jyoliar-lab/ops-workflow#20
on:
  pull_request:
  push:
    branches:
      - prod
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # 업스트림 3종의 gRPC 계약 모듈은 private 저장소의 공표물이다(ADR-0020) — 기본
      # GITHUB_TOKEN은 이 저장소 범위라 형제 저장소를 읽지 못한다. 러너는 일회용이므로
      # 여기서는 gitconfig에 그대로 심는다(이미지 빌드 쪽은 BuildKit secret — create-tag.yaml).
      - name: Configure access to private contract modules
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -z "${PRIVATE_DEPS_TOKEN}" ]; then
            echo "::error::PRIVATE_DEPS_TOKEN 시크릿이 없습니다 — private 계약 모듈(github.com/jyoliar-careerhub/*)을 받을 수 없습니다."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          echo "GOPRIVATE=github.com/jyoliar-careerhub/*" >> "$GITHUB_ENV"

      - name: Regenerate from spec
        run: make openapi

      - name: Fail on drift between spec and generated code
        run: |
          git diff --exit-code -- careerhub/apicomposer/api/ \
            || { echo "::error::openapi.yaml과 api.gen.go가 어긋났습니다. 'make openapi' 실행 후 결과를 커밋하세요."; exit 1; }

      - name: Build
        run: go build ./...

      - name: Test
        run: make test
