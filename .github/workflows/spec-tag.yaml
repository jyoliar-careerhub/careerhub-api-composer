name: Publish spec tag

# REST 계약 공표 좌표 (ADR-0019·0020, jyoliar-lab/ops-workflow#30)
#   openapi.yaml을 바꾼 머지(prod)에 spec/v{info.version} 태그를 자동 생성한다.
#   태그는 소비자(careerhub-web 등)가 핀할 불변 공표 좌표다 — 버전에 semver 의미는
#   아직 없다(좌표일 뿐, 의미 부여는 ADR-0021 보류 벌의 관할).
#
# 게이트: 같은 버전 태그가 이미 있으면 실패 — "버전 미범프 스펙 변경"을 거부한다.
#   - pull_request의 check-version-bumped: 머지 전에 같은 검사를 미리 돌려 조기에 알린다.
#   - push(prod)의 publish-tag: 태그 생성 자체가 최종 게이트다.
#
# 앱 빌드 태그(v*, create-tag.yaml)와 불교차 — spec/ prefix는 v*에 매칭되지 않는다.

on:
  pull_request:
    paths:
      - careerhub/apicomposer/api/openapi.yaml
  push:
    branches:
      - prod
    paths:
      - careerhub/apicomposer/api/openapi.yaml

permissions:
  contents: write

jobs:
  check-version-bumped:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read info.version
        id: version
        run: |
          VERSION="$(yq '.info.version' careerhub/apicomposer/api/openapi.yaml)"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::info.version이 X.Y.Z 형식이 아닙니다: '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fail if spec/v${{ steps.version.outputs.version }} already exists
        run: |
          if git ls-remote --exit-code origin "refs/tags/spec/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::error::spec/v${{ steps.version.outputs.version }} 태그가 이미 존재합니다. openapi.yaml의 info.version을 범프하세요 — 스펙 변경은 새 공표 좌표를 요구합니다."
            exit 1
          fi

  publish-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read info.version
        id: version
        run: |
          VERSION="$(yq '.info.version' careerhub/apicomposer/api/openapi.yaml)"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::info.version이 X.Y.Z 형식이 아닙니다: '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag spec/v${{ steps.version.outputs.version }}
        run: |
          TAG="spec/v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG 태그가 이미 존재합니다 — 버전 미범프 스펙 변경이 머지되었습니다. info.version 범프를 담은 후속 PR이 필요합니다."
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
