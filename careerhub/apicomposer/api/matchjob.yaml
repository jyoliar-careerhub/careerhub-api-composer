# 매칭 조건 경로 절편 — controller/matchJob_controller.go 대응 (로그인 + AUTHORITY_MATCH_JOB 필요)
# 루트 명세(openapi.yaml)의 paths에서 $ref로 조립된다. 단독 문서가 아니다.
paths:
  /my/match-job:
    get:
      operationId: findMatchJob
      tags: [match-job]
      summary: 매칭 조건 목록·메일 수신 동의 조회
      description: AUTHORITY_MATCH_JOB 권한이 필요하다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 매칭 설정
          content:
            application/json:
              schema:
                $ref: './schemas/userinfo.yaml#/components/schemas/MatchJob'
        '401':
          description: 로그인 필요 (본문 없음)
        '403':
          description: 필요 권한 없음 (본문 없음)
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string

  /my/match-job/condition:
    post:
      operationId: addMatchJobCondition
      tags: [match-job]
      summary: 매칭 조건 추가 (사용자당 최대 2건)
      description: |
        AUTHORITY_MATCH_JOB 권한이 필요하다.
        조건 수 상한(2건) 도달 등으로 추가되지 않으면 `isSuccess: false`가 반환된다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/userinfo.yaml#/components/schemas/AddConditionRequest'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: './schemas/userinfo.yaml#/components/schemas/IsSuccessResponse'
        '401':
          description: 로그인 필요 (본문 없음)
        '403':
          description: 필요 권한 없음 (본문 없음)
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string
    put:
      operationId: updateMatchJobCondition
      tags: [match-job]
      summary: 매칭 조건 수정
      description: AUTHORITY_MATCH_JOB 권한이 필요하다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/userinfo.yaml#/components/schemas/UpdateConditionRequest'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: './schemas/userinfo.yaml#/components/schemas/IsSuccessResponse'
        '401':
          description: 로그인 필요 (본문 없음)
        '403':
          description: 필요 권한 없음 (본문 없음)
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string
    delete:
      operationId: deleteMatchJobCondition
      tags: [match-job]
      summary: 매칭 조건 삭제
      description: AUTHORITY_MATCH_JOB 권한이 필요하다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/userinfo.yaml#/components/schemas/DeleteConditionRequest'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: './schemas/userinfo.yaml#/components/schemas/IsSuccessResponse'
        '401':
          description: 로그인 필요 (본문 없음)
        '403':
          description: 필요 권한 없음 (본문 없음)
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string

  /my/match-job/agree-to-mail:
    put:
      operationId: updateAgreeToMail
      tags: [match-job]
      summary: 매칭 메일 수신 동의 변경
      description: AUTHORITY_MATCH_JOB 권한이 필요하다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/userinfo.yaml#/components/schemas/UpdateAgreeToMailRequest'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: './schemas/userinfo.yaml#/components/schemas/IsSuccessResponse'
        '401':
          description: 로그인 필요 (본문 없음)
        '403':
          description: 필요 권한 없음 (본문 없음)
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string
