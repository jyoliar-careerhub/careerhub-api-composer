# 스크랩(북마크) 경로 절편 — controller/scrapJob_controller.go 대응 (로그인 필요)
# 루트 명세(openapi.yaml)의 paths에서 $ref로 조립된다. 단독 문서가 아니다.
paths:
  /my/scrap-job:
    get:
      operationId: getScrapJobs
      tags: [scrap-job]
      summary: 스크랩한 채용공고 목록 조회
      description: |
        스크랩 목록을 공고 정보로 보강해 반환한다. scrapInfo는 항상 채워진다.
        JWT에 AUTHORITY_READ_REVIEW 권한이 있으면 reviewInfo도 채워진다.
      security:
        - bearerAuth: []
      parameters:
        - name: tag
          in: query
          required: false
          description: 지정 시 해당 태그가 달린 스크랩만 반환
          schema:
            type: string
      responses:
        '200':
          description: 스크랩한 공고 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components.yaml#/components/schemas/JobPosting'
        '401':
          description: 로그인 필요 (`Unauthorized`)
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string
    post:
      operationId: addScrapJob
      tags: [scrap-job]
      summary: 채용공고 스크랩 추가
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/ScrapJobTarget'
      responses:
        '201':
          description: 스크랩 추가됨 (본문 없음)
        '401':
          description: 로그인 필요 (`Unauthorized`)
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string
    delete:
      operationId: removeScrapJob
      tags: [scrap-job]
      summary: 채용공고 스크랩 제거
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/ScrapJobTarget'
      responses:
        '200':
          description: 스크랩 제거됨 (본문 없음)
        '401':
          description: 로그인 필요 (`Unauthorized`)
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: 해당 스크랩이 존재하지 않음 (`Scrap job not found`)
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string

  /my/scrap-job/untagged:
    get:
      operationId: getUntaggedScrapJobs
      tags: [scrap-job]
      summary: 태그가 없는 스크랩 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: |
            태그 없는 스크랩 목록. 스크랩이 없으면 배열 대신 `null`이 반환될 수 있다.
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: './components.yaml#/components/schemas/ScrapJob'
        '401':
          description: 로그인 필요 (`Unauthorized`)
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string

  /my/scrap-job/tags:
    get:
      operationId: getScrapTags
      tags: [scrap-job]
      summary: 스크랩에 사용한 태그 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 태그 목록. 태그가 없으면 `tags` 필드가 생략된다.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/ScrapTagsResponse'
        '401':
          description: 로그인 필요 (`Unauthorized`)
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string
    post:
      operationId: addScrapTag
      tags: [scrap-job]
      summary: 스크랩에 태그 추가
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/ScrapTagTarget'
      responses:
        '200':
          description: 태그 추가됨 (본문 없음)
        '401':
          description: 로그인 필요 (`Unauthorized`)
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: 해당 스크랩이 존재하지 않음 (`Scrap job not found`)
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string
    delete:
      operationId: removeScrapTag
      tags: [scrap-job]
      summary: 스크랩에서 태그 제거
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/ScrapTagTarget'
      responses:
        '200':
          description: 태그 제거됨 (본문 없음)
        '401':
          description: 로그인 필요 (`Unauthorized`)
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: 해당 스크랩이 존재하지 않음 (`Scrap job not found`)
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string
