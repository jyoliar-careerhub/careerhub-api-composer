# 리뷰 도메인 스키마 — common/domain/review.go 대응
# 모델 생성 입력이다(make openapi → models-review.gen.go). 단독 API 문서가 아니다.
openapi: 3.0.3
info:
  title: CareerHub API Composer — review schemas
  version: 0.1.0
paths: {}
components:
  schemas:
    ReviewInfo:
      type: object
      description: 회사 리뷰 요약. 리뷰 데이터가 없으면 상위 객체에서 필드 자체가 생략된다.
      required:
        - score
        - reviewCount
        - defaultName
        - isCompleteCrawl
      properties:
        score:
          type: integer
          format: int32
        reviewCount:
          type: integer
          format: int32
        defaultName:
          type: string
        isCompleteCrawl:
          type: boolean

    Review:
      type: object
      required:
        - score
        - summary
        - employmentStatus
        - reviewUserId
        - jobType
        - date
      properties:
        score:
          type: integer
          format: int32
        summary:
          type: string
        employmentStatus:
          type: boolean
          description: 리뷰 작성 시점의 재직 여부
        reviewUserId:
          type: string
        jobType:
          type: string
        date:
          type: string
          format: date-time

