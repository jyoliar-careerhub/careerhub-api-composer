# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
# jobposting 도메인 모델 생성 설정 — 입력은 jobposting.yaml. 재생성: make openapi
package: api
generate:
  models: true
output: models-jobposting.gen.go
output-options:
  # 스키마 파일에는 paths가 없어 전 컴포넌트가 "미사용"으로 보인다 — 프루닝을 끈다
  skip-prune: true
# 교차 도메인 참조(ReviewInfo·Review)는 models-review.gen.go에 있다 — 같은 패키지 매핑
import-mapping:
  ./review.yaml: '-'
