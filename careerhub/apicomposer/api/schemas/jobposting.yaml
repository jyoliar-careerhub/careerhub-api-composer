# 채용공고 도메인 스키마 — common/domain/jobposting.go + posting proto 응답 타입 대응
# 모델 생성 입력이다(make openapi → models-jobposting.gen.go). 단독 API 문서가 아니다.
openapi: 3.0.3
info:
  title: CareerHub API Composer — jobposting schemas
  version: 0.1.0
paths: {}
components:
  schemas:
    JobPostingStatus:
      type: string
      description: 공고 상태. 원천(careerhub-posting-service)의 전체 값 목록이다.
      enum:
        - hiring
        - closed

    JobPosting:
      type: object
      description: 채용공고 목록 항목
      required:
        - site
        - postingId
        - title
        - companyName
        - skills
        - categories
        - imageUrl
        - addresses
        - minCareer
        - maxCareer
        - status
        - scrapInfo
      properties:
        site:
          type: string
        postingId:
          type: string
        title:
          type: string
        companyName:
          type: string
        skills:
          type: array
          nullable: true
          items:
            type: string
        categories:
          type: array
          nullable: true
          items:
            type: string
        imageUrl:
          type: string
          nullable: true
        addresses:
          type: array
          nullable: true
          items:
            type: string
        minCareer:
          type: integer
          format: int32
          nullable: true
        maxCareer:
          type: integer
          format: int32
          nullable: true
        status:
          $ref: '#/components/schemas/JobPostingStatus'
        scrapInfo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ScrapInfo'
          description: 비로그인 요청이거나 스크랩 정보 로딩에 실패하면 null
        reviewInfo:
          $ref: './review.yaml#/components/schemas/ReviewInfo'

    JobPostingDetail:
      type: object
      description: 채용공고 상세
      required:
        - site
        - postingId
        - title
        - skills
        - intro
        - mainTask
        - qualifications
        - preferred
        - benefits
        - recruitProcess
        - careerMin
        - careerMax
        - addresses
        - companyId
        - companyName
        - companyImages
        - tags
        - status
        - postUrl
        - companyUrl
        - companyLogo
        - scrapInfo
      properties:
        site:
          type: string
        postingId:
          type: string
        title:
          type: string
        skills:
          type: array
          nullable: true
          items:
            type: string
        intro:
          type: string
        mainTask:
          type: string
        qualifications:
          type: string
        preferred:
          type: string
        benefits:
          type: string
        recruitProcess:
          type: string
          nullable: true
        careerMin:
          type: integer
          format: int32
          nullable: true
        careerMax:
          type: integer
          format: int32
          nullable: true
        addresses:
          type: array
          nullable: true
          items:
            type: string
        companyId:
          type: string
        companyName:
          type: string
        companyImages:
          type: array
          nullable: true
          items:
            type: string
        tags:
          type: array
          nullable: true
          items:
            type: string
        status:
          $ref: '#/components/schemas/JobPostingStatus'
        postUrl:
          type: string
        companyUrl:
          type: string
          nullable: true
        companyLogo:
          type: string
        scrapInfo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ScrapInfo'
          description: 비로그인 요청이거나 스크랩 정보 로딩에 실패하면 null
        reviewInfo:
          $ref: './review.yaml#/components/schemas/ReviewInfo'
        firstPageReviews:
          type: array
          description: 회사 리뷰 첫 페이지 (리뷰 데이터가 없으면 필드 생략)
          items:
            $ref: './review.yaml#/components/schemas/Review'

    ScrapInfo:
      type: object
      required:
        - isScrapped
        - tags
      properties:
        isScrapped:
          type: boolean
        tags:
          type: array
          items:
            type: string

    CountResponse:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int64

    CategoriesResponse:
      type: object
      description: proto 생성 타입 직렬화 — 빈 값 필드는 생략된다(omitempty)
      properties:
        categoriesBySite:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRes'

    CategoryRes:
      type: object
      properties:
        site:
          type: string
        categories:
          type: array
          items:
            type: string

    SkillsResponse:
      type: object
      description: proto 생성 타입 직렬화 — 빈 값 필드는 생략된다(omitempty)
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillRes'

    SkillRes:
      type: object
      properties:
        defaultName:
          type: string
        skillNames:
          type: array
          items:
            type: string

    CompaniesResponse:
      type: object
      description: proto 생성 타입 직렬화 — 빈 값 필드는 생략된다(omitempty)
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanyRes'

    CompanyRes:
      type: object
      properties:
        defaultName:
          type: string
        siteCompanies:
          type: array
          items:
            $ref: '#/components/schemas/SiteCompanyRes'

    SiteCompanyRes:
      type: object
      properties:
        site:
          type: string
        companyId:
          type: string
        companyName:
          type: string

