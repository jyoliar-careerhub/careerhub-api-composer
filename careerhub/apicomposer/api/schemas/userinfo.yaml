# 사용자정보 도메인 스키마 — common/domain/userinfo.go + userinfo dto·proto 타입 대응
# 모델 생성 입력이다(make openapi → models-userinfo.gen.go). 단독 API 문서가 아니다.
openapi: 3.0.3
info:
  title: CareerHub API Composer — userinfo schemas
  version: 0.1.0
paths: {}
components:
  schemas:
    ScrapJob:
      type: object
      description: proto 생성 타입 직렬화 — 빈 값 필드는 생략된다(omitempty)
      properties:
        site:
          type: string
        postingId:
          type: string
        tags:
          type: array
          items:
            type: string

    ScrapTagsResponse:
      type: object
      description: proto 생성 타입 직렬화 — 태그가 없으면 tags 필드가 생략된다(omitempty)
      properties:
        tags:
          type: array
          items:
            type: string

    ScrapJobTarget:
      type: object
      description: |
        스크랩 추가·제거 대상. 요청 본문의 userId 필드는 무시되고
        인증 토큰의 userId로 덮어써진다.
      required:
        - site
        - postingId
      properties:
        site:
          type: string
        postingId:
          type: string

    ScrapTagTarget:
      type: object
      description: |
        태그 추가·제거 대상. 요청 본문의 userId 필드는 무시되고
        인증 토큰의 userId로 덮어써진다.
      required:
        - site
        - postingId
        - tag
      properties:
        site:
          type: string
        postingId:
          type: string
        tag:
          type: string

    MatchJob:
      type: object
      required:
        - conditions
        - agreeToMail
      properties:
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        agreeToMail:
          type: boolean

    Condition:
      type: object
      required:
        - conditionId
        - conditionName
        - query
      properties:
        conditionId:
          type: string
        conditionName:
          type: string
        query:
          $ref: './query.yaml#/components/schemas/Query'

    AddConditionRequest:
      type: object
      required:
        - conditionName
        - query
      properties:
        conditionName:
          type: string
        query:
          $ref: './query.yaml#/components/schemas/Query'

    UpdateConditionRequest:
      type: object
      required:
        - conditionId
        - conditionName
        - query
      properties:
        conditionId:
          type: string
        conditionName:
          type: string
        query:
          $ref: './query.yaml#/components/schemas/Query'

    DeleteConditionRequest:
      type: object
      required:
        - conditionId
      properties:
        conditionId:
          type: string

    UpdateAgreeToMailRequest:
      type: object
      required:
        - agreeToMail
      properties:
        agreeToMail:
          type: boolean

    IsSuccessResponse:
      type: object
      required:
        - isSuccess
      properties:
        isSuccess:
          type: boolean
