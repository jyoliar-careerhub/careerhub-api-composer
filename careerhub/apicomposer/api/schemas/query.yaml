# 검색 조건 스키마 — common/query 대응
# 모델 생성 입력이다(make openapi → models-query.gen.go). 단독 API 문서가 아니다.
openapi: 3.0.3
info:
  title: CareerHub API Composer — query schemas
  version: 0.1.0
paths: {}
components:
  schemas:
    Query:
      type: object
      description: |
        채용공고 검색 조건. `encoded_query` 파라미터(base64 JSON)와
        매칭 조건(Condition)의 query 필드에 쓰인다.
      properties:
        categories:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/CategoryQuery'
        skillNames:
          type: array
          nullable: true
          description: 바깥 배열은 AND, 안쪽 배열은 OR 조건
          items:
            type: array
            items:
              type: string
        minCareer:
          type: integer
          format: int32
          nullable: true
        maxCareer:
          type: integer
          format: int32
          nullable: true
        companies:
          type: array
          nullable: true
          description: 매칭 조건(match-job) 응답에서는 항상 null이다
          items:
            $ref: '#/components/schemas/SiteCompanyQuery'

    CategoryQuery:
      type: object
      required:
        - site
        - categoryName
      properties:
        site:
          type: string
        categoryName:
          type: string

    SiteCompanyQuery:
      type: object
      required:
        - site
        - companyName
      properties:
        site:
          type: string
        companyName:
          type: string

