# 회사 리뷰 경로 절편 — controller/review_controller.go 대응 (공개)
# 루트 명세(openapi.yaml)의 paths에서 $ref로 조립된다. 단독 문서가 아니다.
paths:
  /company-review/reviews:
    get:
      operationId: getCompanyReviews
      tags: [company-review]
      summary: 회사 리뷰 목록 조회
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: companyName
          in: query
          required: true
          description: 회사명. 빈 값이면 400 (`companyName is required`)
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호 (기본 0). 음수·비정수면 400
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지 크기 (기본 10). 음수·비정수면 400
          schema:
            type: integer
            minimum: 0
            default: 10
      responses:
        '200':
          description: 리뷰 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components.yaml#/components/schemas/Review'
        '400':
          description: 요청 파라미터 불량 (본문은 오류 메시지)
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Authorization 헤더가 존재하나 토큰이 무효(만료 등) (본문 없음)
        '500':
          description: |
            서버 내부 오류. 이 엔드포인트는 오류 메시지 원문을 본문으로 반환한다.
          content:
            text/plain:
              schema:
                type: string
