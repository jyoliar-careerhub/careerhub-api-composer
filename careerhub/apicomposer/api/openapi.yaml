openapi: 3.0.3
info:
  title: CareerHub API Composer REST API
  description: |
    api-composer가 프론트(careerhub-front)에 제공하는 REST 계약.

    **상태**: 이 명세는 현행 구현(2026-07 기준, 활성 엔드포인트 19개)을 전사한 것이다.
    전 컨트롤러가 생성 인터페이스로 구속되는 Epic(jyoliar-lab/ops-workflow#13) 완료 전까지
    이 명세는 계약의 진실이 아니다 — 구속되지 않은 엔드포인트에 대해 구현과 다를 수 있다.

    - 인증: `Authorization: Bearer {JWT}` 헤더. 헤더가 존재하나 토큰이 무효(만료·서명 불일치)면
      전역 미들웨어가 본문 없는 401을 반환한다(공개 엔드포인트 포함). 형식 불량(malformed) 토큰은
      본문 없는 500을 반환한다.
    - 에러 응답은 `http.Error` 기반의 `text/plain; charset=utf-8` 본문(메시지 + 개행)이다.
    - 모든 경로는 배포 환경변수 `ROOT_PATH`의 prefix 아래에 마운트될 수 있다.
  version: 0.1.0
servers:
  - url: /
    description: ROOT_PATH prefix 아래에 마운트될 수 있다 (배포 설정의 관할)

tags:
  - name: job-postings
    description: 채용공고 조회 (공개, 로그인 시 스크랩 정보 부가)
  - name: scrap-job
    description: 사용자 스크랩(북마크) 관리 (로그인 필요)
  - name: match-job
    description: 사용자 매칭 조건 관리 (로그인 + AUTHORITY_MATCH_JOB 권한 필요)
  - name: company-review
    description: 회사 리뷰 조회 (공개)

paths:
  # 경로 절편은 레거시 컨트롤러 경계대로 분리되어 있다:
  #   jobposting.yaml — controller/jobposting_controller.go
  #   scrapjob.yaml   — controller/scrapJob_controller.go
  #   matchjob.yaml   — controller/matchJob_controller.go
  #   review.yaml     — controller/review_controller.go
  # 공유 컴포넌트(schemas·responses·parameters·securitySchemes)는 이 파일이 단일 정의처다.
  /job_postings:
    $ref: './jobposting.yaml#/paths/~1job_postings'
  /job_postings/count:
    $ref: './jobposting.yaml#/paths/~1job_postings~1count'
  /job_postings/{site}/{postingId}:
    $ref: './jobposting.yaml#/paths/~1job_postings~1{site}~1{postingId}'
  /categories:
    $ref: './jobposting.yaml#/paths/~1categories'
  /skills:
    $ref: './jobposting.yaml#/paths/~1skills'
  /companies:
    $ref: './jobposting.yaml#/paths/~1companies'
  /my/scrap-job:
    $ref: './scrapjob.yaml#/paths/~1my~1scrap-job'
  /my/scrap-job/untagged:
    $ref: './scrapjob.yaml#/paths/~1my~1scrap-job~1untagged'
  /my/scrap-job/tags:
    $ref: './scrapjob.yaml#/paths/~1my~1scrap-job~1tags'
  /my/match-job:
    $ref: './matchjob.yaml#/paths/~1my~1match-job'
  /my/match-job/condition:
    $ref: './matchjob.yaml#/paths/~1my~1match-job~1condition'
  /my/match-job/agree-to-mail:
    $ref: './matchjob.yaml#/paths/~1my~1match-job~1agree-to-mail'
  /company-review/reviews:
    $ref: './review.yaml#/paths/~1company-review~1reviews'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer {token}`. 토큰의 Claims에 userId·authorities가 담긴다.
        (현행 파서는 `Bearer ` prefix 없이 토큰만 보내도 수용한다.)
