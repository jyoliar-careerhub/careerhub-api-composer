openapi: 3.0.3
info:
  title: CareerHub API Composer REST API
  description: |
    api-composer가 프론트(careerhub-front)에 제공하는 REST 계약.

    **상태**: 이 명세는 현행 구현(2026-07 기준, 활성 엔드포인트 19개)을 전사한 것이다.
    전 컨트롤러가 생성 인터페이스로 구속되는 Epic(jyoliar-lab/ops-workflow#13) 완료 전까지
    이 명세는 계약의 진실이 아니다 — 구속되지 않은 엔드포인트에 대해 구현과 다를 수 있다.

    - 인증: `Authorization: Bearer {JWT}` 헤더. 헤더가 존재하나 토큰이 무효(만료·형식 불량·
      서명 불일치)면 전역 미들웨어가 원인 불문 401을 반환한다(공개 엔드포인트 포함, RFC 6750).
      무효 원인은 본문에 노출하지 않는다 — 구분은 서버 로그로만 남는다.
    - 로그인 필수 여부는 각 연산의 `security` 선언이 원천이다 — `bearerAuth` 요구 연산에
      비로그인으로 접근하면 401, `{}` 대안이 선언된 연산은 비로그인 접근을 허용한다.
    - 에러 응답은 어떤 경로(핸들러·생성 코드·미들웨어)로 끊기든 구조화 JSON(`ErrorResponse`)이다.
    - 모든 경로는 배포 환경변수 `ROOT_PATH`의 prefix 아래에 마운트될 수 있다.
  version: 0.2.0
servers:
  - url: /
    description: ROOT_PATH prefix 아래에 마운트될 수 있다 (배포 설정의 관할)

tags:
  - name: job-postings
    description: 채용공고 조회 (공개, 로그인 시 스크랩 정보 부가)
  - name: scrap-job
    description: 사용자 스크랩(북마크) 관리 (로그인 필요)
  - name: match-job
    description: 사용자 매칭 조건 관리 (로그인 + AUTHORITY_MATCH_JOB 권한 필요)
  - name: company-review
    description: 회사 리뷰 조회 (공개)
  - name: meta
    description: 계약·서버 메타 정보 (공개)

paths:
  /job_postings:
    get:
      operationId: getJobPostings
      tags: [job-postings]
      summary: 채용공고 목록 조회
      description: |
        검색 조건(encoded_query)에 맞는 채용공고 페이지를 반환한다.
        로그인(유효한 Authorization 헤더) 시 각 공고에 스크랩 정보(scrapInfo)가 채워진다.
        비로그인 시 scrapInfo는 null이다.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/EncodedQuery'
      responses:
        '200':
          description: 채용공고 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobPosting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedToken'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /job_postings/count:
    get:
      operationId: countJobPostings
      tags: [job-postings]
      summary: 검색 조건에 맞는 채용공고 수 조회
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EncodedQuery'
      responses:
        '200':
          description: 공고 수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedToken'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /job_postings/{site}/{postingId}:
    get:
      operationId: getJobPostingDetail
      tags: [job-postings]
      summary: 채용공고 상세 조회
      description: |
        로그인 시 scrapInfo가 채워진다. 비로그인 시 scrapInfo는 null이다.
        회사 리뷰 데이터가 존재하면 reviewInfo·firstPageReviews가 포함된다(없으면 필드 생략).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: site
          in: path
          required: true
          description: 공고 출처 사이트 식별자
          schema:
            type: string
        - name: postingId
          in: path
          required: true
          description: 사이트 내 공고 식별자
          schema:
            type: string
      responses:
        '200':
          description: 채용공고 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPostingDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedToken'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories:
    get:
      operationId: getCategories
      tags: [job-postings]
      summary: 사이트별 직무 카테고리 목록 조회
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: 사이트별 카테고리 목록
          headers:
            Cache-Control:
              description: '`max-age=86400, public`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedToken'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /skills:
    get:
      operationId: getSkills
      tags: [job-postings]
      summary: 기술 스택 목록 조회
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: 기술 스택 목록
          headers:
            Cache-Control:
              description: '`max-age=86400, public`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedToken'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /companies:
    get:
      operationId: getCompanies
      tags: [job-postings]
      summary: 회사명 prefix 검색 (최대 5건)
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: true
          description: 회사명 prefix 검색어 (비어 있으면 400)
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 회사 목록
          headers:
            Cache-Control:
              description: '`max-age=43200, public`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompaniesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedToken'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /my/scrap-job:
    get:
      operationId: getScrapJobs
      tags: [scrap-job]
      summary: 스크랩한 채용공고 목록 조회
      description: |
        스크랩 목록을 공고 정보로 보강해 반환한다. scrapInfo는 항상 채워진다.
        JWT에 AUTHORITY_READ_REVIEW 권한이 있으면 reviewInfo도 채워진다.
      security:
        - bearerAuth: []
      parameters:
        - name: tag
          in: query
          required: false
          description: 지정 시 해당 태그가 달린 스크랩만 반환
          schema:
            type: string
      responses:
        '200':
          description: 스크랩한 공고 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobPosting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: addScrapJob
      tags: [scrap-job]
      summary: 채용공고 스크랩 추가
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapJobTarget'
      responses:
        '201':
          description: 스크랩 추가됨 (본문 없음)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: removeScrapJob
      tags: [scrap-job]
      summary: 채용공고 스크랩 제거
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapJobTarget'
      responses:
        '200':
          description: 스크랩 제거됨 (본문 없음)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /my/scrap-job/untagged:
    get:
      operationId: getUntaggedScrapJobs
      tags: [scrap-job]
      summary: 태그가 없는 스크랩 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: |
            태그 없는 스크랩 목록. 스크랩이 없으면 배열 대신 `null`이 반환될 수 있다.
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: '#/components/schemas/ScrapJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /my/scrap-job/tags:
    get:
      operationId: getScrapTags
      tags: [scrap-job]
      summary: 스크랩에 사용한 태그 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 태그 목록. 태그가 없으면 `tags` 필드가 생략된다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapTagsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: addScrapTag
      tags: [scrap-job]
      summary: 스크랩에 태그 추가
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapTagTarget'
      responses:
        '200':
          description: 태그 추가됨 (본문 없음)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: removeScrapTag
      tags: [scrap-job]
      summary: 스크랩에서 태그 제거
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapTagTarget'
      responses:
        '200':
          description: 태그 제거됨 (본문 없음)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /my/match-job:
    get:
      operationId: findMatchJob
      tags: [match-job]
      summary: 매칭 조건 목록·메일 수신 동의 조회
      description: AUTHORITY_MATCH_JOB 권한이 필요하다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 매칭 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /my/match-job/condition:
    post:
      operationId: addMatchJobCondition
      tags: [match-job]
      summary: 매칭 조건 추가 (사용자당 최대 2건)
      description: |
        AUTHORITY_MATCH_JOB 권한이 필요하다.
        조건 수 상한(2건) 도달 등으로 추가되지 않으면 `isSuccess: false`가 반환된다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConditionRequest'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateMatchJobCondition
      tags: [match-job]
      summary: 매칭 조건 수정
      description: AUTHORITY_MATCH_JOB 권한이 필요하다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConditionRequest'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteMatchJobCondition
      tags: [match-job]
      summary: 매칭 조건 삭제
      description: AUTHORITY_MATCH_JOB 권한이 필요하다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteConditionRequest'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /my/match-job/agree-to-mail:
    put:
      operationId: updateAgreeToMail
      tags: [match-job]
      summary: 매칭 메일 수신 동의 변경
      description: AUTHORITY_MATCH_JOB 권한이 필요하다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgreeToMailRequest'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /company-review/reviews:
    get:
      operationId: getCompanyReviews
      tags: [company-review]
      summary: 회사 리뷰 목록 조회
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: companyName
          in: query
          required: true
          description: 회사명 (비어 있으면 400)
          schema:
            type: string
            minLength: 1
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호 (기본 0). 음수·비정수면 400
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지 크기 (기본 10). 음수·비정수면 400
          schema:
            type: integer
            minimum: 0
            default: 10
      responses:
        '200':
          description: 리뷰 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedToken'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /contract/version:
    get:
      operationId: getContractVersion
      tags: [meta]
      summary: 서빙 중인 REST 계약 버전 조회
      description: |
        이 서버 바이너리에 내장된 계약(openapi.yaml)의 info.version을 반환한다.
        소비자가 미구현 신호(501)나 미존재 라우트(404)를 만났을 때 서버가 어느 계약
        버전을 서빙 중인지 확인하는 런타임 탐침이다(ADR-0019 Consequences — 신호
        자체로는 "아직 미구현"과 "구버전 서버"가 구분되지 않는다).
      security:
        - {}
      responses:
        '200':
          description: 계약 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
        '401':
          $ref: '#/components/responses/UnauthorizedToken'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer {token}`. 토큰의 Claims에 userId·authorities가 담긴다.
        (현행 파서는 `Bearer ` prefix 없이 토큰만 보내도 수용한다.)

  parameters:
    Page:
      name: page
      in: query
      required: true
      description: 1부터 시작하는 페이지 번호. 누락·비정수·1 미만이면 400
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: size
      in: query
      required: true
      description: 페이지 크기 (1–100). 누락·비정수·범위 밖이면 400
      schema:
        type: integer
        minimum: 1
        maximum: 100
    EncodedQuery:
      name: encoded_query
      in: query
      required: true
      description: |
        검색 조건 `Query` 객체의 JSON을 base64(표준, 패딩 포함) 인코딩한 문자열.
        디코딩·파싱에 실패하면 400 (`bad request`).
        검증 실패(minCareer/maxCareer 음수, minCareer > maxCareer)면 400 (검증 메시지 본문).
      schema:
        type: string
        format: byte

  responses:
    BadRequest:
      description: 요청 파라미터·본문 불량
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 로그인 필요 또는 토큰 무효 — 원인 미노출 일반 문구
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedToken:
      description: |
        Authorization 헤더가 존재하나 토큰이 무효(만료·형식 불량·서명 불일치).
        무효 원인은 본문에 노출하지 않는다 — 구분은 서버 로그로만 남는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 필요 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 대상이 존재하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotImplemented:
      description: |
        공표됐으나 아직 구현되지 않은 연산(ADR-0019의 정상 상태).
        계약 합의가 구현보다 먼저 머지(공표)된 경우, 구현 완료 전까지 이 응답이 나간다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      description: 구조화 에러 응답 — 전 엔드포인트 공통 에러 계약
      required:
        - message
      properties:
        message:
          type: string
          description: 사람이 읽을 수 있는 오류 설명

    ContractVersion:
      type: object
      description: 서버가 서빙 중인 REST 계약의 버전 — 공표 태그(spec/vX.Y.Z)의 X.Y.Z와 같은 값
      required:
        - version
      properties:
        version:
          type: string
          description: 내장 명세(openapi.yaml)의 info.version (예 "0.2.0")

    JobPostingStatus:
      type: string
      description: 공고 상태. 원천(careerhub-posting-service)의 전체 값 목록이다.
      enum:
        - hiring
        - closed

    JobPosting:
      type: object
      description: 채용공고 목록 항목
      required:
        - site
        - postingId
        - title
        - companyName
        - skills
        - categories
        - imageUrl
        - addresses
        - minCareer
        - maxCareer
        - status
        - scrapInfo
      properties:
        site:
          type: string
        postingId:
          type: string
        title:
          type: string
        companyName:
          type: string
        skills:
          type: array
          nullable: true
          items:
            type: string
        categories:
          type: array
          nullable: true
          items:
            type: string
        imageUrl:
          type: string
          nullable: true
        addresses:
          type: array
          nullable: true
          items:
            type: string
        minCareer:
          type: integer
          format: int32
          nullable: true
        maxCareer:
          type: integer
          format: int32
          nullable: true
        status:
          $ref: '#/components/schemas/JobPostingStatus'
        scrapInfo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ScrapInfo'
          description: 비로그인 요청이거나 스크랩 정보 로딩에 실패하면 null
        reviewInfo:
          $ref: '#/components/schemas/ReviewInfo'

    JobPostingDetail:
      type: object
      description: 채용공고 상세
      required:
        - site
        - postingId
        - title
        - skills
        - intro
        - mainTask
        - qualifications
        - preferred
        - benefits
        - recruitProcess
        - careerMin
        - careerMax
        - addresses
        - companyId
        - companyName
        - companyImages
        - tags
        - status
        - postUrl
        - companyUrl
        - companyLogo
        - scrapInfo
      properties:
        site:
          type: string
        postingId:
          type: string
        title:
          type: string
        skills:
          type: array
          nullable: true
          items:
            type: string
        intro:
          type: string
        mainTask:
          type: string
        qualifications:
          type: string
        preferred:
          type: string
        benefits:
          type: string
        recruitProcess:
          type: string
          nullable: true
        careerMin:
          type: integer
          format: int32
          nullable: true
        careerMax:
          type: integer
          format: int32
          nullable: true
        addresses:
          type: array
          nullable: true
          items:
            type: string
        companyId:
          type: string
        companyName:
          type: string
        companyImages:
          type: array
          nullable: true
          items:
            type: string
        tags:
          type: array
          nullable: true
          items:
            type: string
        status:
          $ref: '#/components/schemas/JobPostingStatus'
        postUrl:
          type: string
        companyUrl:
          type: string
          nullable: true
        companyLogo:
          type: string
        scrapInfo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ScrapInfo'
          description: 비로그인 요청이거나 스크랩 정보 로딩에 실패하면 null
        reviewInfo:
          $ref: '#/components/schemas/ReviewInfo'
        firstPageReviews:
          type: array
          description: 회사 리뷰 첫 페이지 (리뷰 데이터가 없으면 필드 생략)
          items:
            $ref: '#/components/schemas/Review'

    ScrapInfo:
      type: object
      required:
        - isScrapped
        - tags
      properties:
        isScrapped:
          type: boolean
        tags:
          type: array
          items:
            type: string

    ReviewInfo:
      type: object
      description: 회사 리뷰 요약. 리뷰 데이터가 없으면 상위 객체에서 필드 자체가 생략된다.
      required:
        - score
        - reviewCount
        - defaultName
        - isCompleteCrawl
      properties:
        score:
          type: integer
          format: int32
        reviewCount:
          type: integer
          format: int32
        defaultName:
          type: string
        isCompleteCrawl:
          type: boolean

    Review:
      type: object
      required:
        - score
        - summary
        - employmentStatus
        - reviewUserId
        - jobType
        - date
      properties:
        score:
          type: integer
          format: int32
        summary:
          type: string
        employmentStatus:
          type: boolean
          description: 리뷰 작성 시점의 재직 여부
        reviewUserId:
          type: string
        jobType:
          type: string
        date:
          type: string
          format: date-time

    CountResponse:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int64

    Query:
      type: object
      description: |
        채용공고 검색 조건. `encoded_query` 파라미터(base64 JSON)와
        매칭 조건(Condition)의 query 필드에 쓰인다.
      properties:
        categories:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/CategoryQuery'
        skillNames:
          type: array
          nullable: true
          description: 바깥 배열은 AND, 안쪽 배열은 OR 조건
          items:
            type: array
            items:
              type: string
        minCareer:
          type: integer
          format: int32
          nullable: true
        maxCareer:
          type: integer
          format: int32
          nullable: true
        companies:
          type: array
          nullable: true
          description: 매칭 조건(match-job) 응답에서는 항상 null이다
          items:
            $ref: '#/components/schemas/SiteCompanyQuery'

    CategoryQuery:
      type: object
      required:
        - site
        - categoryName
      properties:
        site:
          type: string
        categoryName:
          type: string

    SiteCompanyQuery:
      type: object
      required:
        - site
        - companyName
      properties:
        site:
          type: string
        companyName:
          type: string

    CategoriesResponse:
      type: object
      description: proto 생성 타입 직렬화 — 빈 값 필드는 생략된다(omitempty)
      properties:
        categoriesBySite:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRes'

    CategoryRes:
      type: object
      properties:
        site:
          type: string
        categories:
          type: array
          items:
            type: string

    SkillsResponse:
      type: object
      description: proto 생성 타입 직렬화 — 빈 값 필드는 생략된다(omitempty)
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillRes'

    SkillRes:
      type: object
      properties:
        defaultName:
          type: string
        skillNames:
          type: array
          items:
            type: string

    CompaniesResponse:
      type: object
      description: proto 생성 타입 직렬화 — 빈 값 필드는 생략된다(omitempty)
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanyRes'

    CompanyRes:
      type: object
      properties:
        defaultName:
          type: string
        siteCompanies:
          type: array
          items:
            $ref: '#/components/schemas/SiteCompanyRes'

    SiteCompanyRes:
      type: object
      properties:
        site:
          type: string
        companyId:
          type: string
        companyName:
          type: string

    ScrapJob:
      type: object
      description: proto 생성 타입 직렬화 — 빈 값 필드는 생략된다(omitempty)
      properties:
        site:
          type: string
        postingId:
          type: string
        tags:
          type: array
          items:
            type: string

    ScrapTagsResponse:
      type: object
      description: proto 생성 타입 직렬화 — 태그가 없으면 tags 필드가 생략된다(omitempty)
      properties:
        tags:
          type: array
          items:
            type: string

    ScrapJobTarget:
      type: object
      description: |
        스크랩 추가·제거 대상. 요청 본문의 userId 필드는 무시되고
        인증 토큰의 userId로 덮어써진다.
      required:
        - site
        - postingId
      properties:
        site:
          type: string
        postingId:
          type: string

    ScrapTagTarget:
      type: object
      description: |
        태그 추가·제거 대상. 요청 본문의 userId 필드는 무시되고
        인증 토큰의 userId로 덮어써진다.
      required:
        - site
        - postingId
        - tag
      properties:
        site:
          type: string
        postingId:
          type: string
        tag:
          type: string

    MatchJob:
      type: object
      required:
        - conditions
        - agreeToMail
      properties:
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        agreeToMail:
          type: boolean

    Condition:
      type: object
      required:
        - conditionId
        - conditionName
        - query
      properties:
        conditionId:
          type: string
        conditionName:
          type: string
        query:
          $ref: '#/components/schemas/Query'

    AddConditionRequest:
      type: object
      required:
        - conditionName
        - query
      properties:
        conditionName:
          type: string
        query:
          $ref: '#/components/schemas/Query'

    UpdateConditionRequest:
      type: object
      required:
        - conditionId
        - conditionName
        - query
      properties:
        conditionId:
          type: string
        conditionName:
          type: string
        query:
          $ref: '#/components/schemas/Query'

    DeleteConditionRequest:
      type: object
      required:
        - conditionId
      properties:
        conditionId:
          type: string

    UpdateAgreeToMailRequest:
      type: object
      required:
        - agreeToMail
      properties:
        agreeToMail:
          type: boolean

    IsSuccessResponse:
      type: object
      required:
        - isSuccess
      properties:
        isSuccess:
          type: boolean
