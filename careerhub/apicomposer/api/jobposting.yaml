# 채용공고 조회 경로 절편 — controller/jobposting_controller.go 대응
# 루트 명세(openapi.yaml)의 paths에서 $ref로 조립된다. 단독 문서가 아니다.
paths:
  /job_postings:
    get:
      operationId: getJobPostings
      tags: [job-postings]
      summary: 채용공고 목록 조회
      description: |
        검색 조건(encoded_query)에 맞는 채용공고 페이지를 반환한다.
        로그인(유효한 Authorization 헤더) 시 각 공고에 스크랩 정보(scrapInfo)가 채워진다.
        비로그인 시 scrapInfo는 null이다.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: true
          description: 1부터 시작하는 페이지 번호. 누락·비정수·1 미만이면 400
          schema:
            type: integer
            minimum: 1
        - name: size
          in: query
          required: true
          description: 페이지 크기 (1–100). 누락·비정수·범위 밖이면 400
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: encoded_query
          in: query
          required: true
          description: |
            검색 조건 `Query` 객체의 JSON을 base64(표준, 패딩 포함) 인코딩한 문자열.
            디코딩·파싱에 실패하면 400 (`bad request`).
            검증 실패(minCareer/maxCareer 음수, minCareer > maxCareer)면 400 (검증 메시지 본문).
          schema:
            type: string
            format: byte
      responses:
        '200':
          description: 채용공고 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas/jobposting.yaml#/components/schemas/JobPosting'
        '400':
          description: 요청 파라미터 불량 (본문은 오류 메시지)
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Authorization 헤더가 존재하나 토큰이 무효(만료 등) (본문 없음)
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string

  /job_postings/count:
    get:
      operationId: countJobPostings
      tags: [job-postings]
      summary: 검색 조건에 맞는 채용공고 수 조회
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: encoded_query
          in: query
          required: true
          description: |
            검색 조건 `Query` 객체의 JSON을 base64(표준, 패딩 포함) 인코딩한 문자열.
            디코딩·파싱에 실패하면 400 (`bad request`).
            검증 실패(minCareer/maxCareer 음수, minCareer > maxCareer)면 400 (검증 메시지 본문).
          schema:
            type: string
            format: byte
      responses:
        '200':
          description: 공고 수
          content:
            application/json:
              schema:
                $ref: './schemas/jobposting.yaml#/components/schemas/CountResponse'
        '400':
          description: 요청 파라미터 불량 (본문은 오류 메시지)
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Authorization 헤더가 존재하나 토큰이 무효(만료 등) (본문 없음)
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string

  /job_postings/{site}/{postingId}:
    get:
      operationId: getJobPostingDetail
      tags: [job-postings]
      summary: 채용공고 상세 조회
      description: |
        로그인 시 scrapInfo가 채워진다. 비로그인 시 scrapInfo는 null이다.
        회사 리뷰 데이터가 존재하면 reviewInfo·firstPageReviews가 포함된다(없으면 필드 생략).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: site
          in: path
          required: true
          description: 공고 출처 사이트 식별자
          schema:
            type: string
        - name: postingId
          in: path
          required: true
          description: 사이트 내 공고 식별자
          schema:
            type: string
      responses:
        '200':
          description: 채용공고 상세
          content:
            application/json:
              schema:
                $ref: './schemas/jobposting.yaml#/components/schemas/JobPostingDetail'
        '401':
          description: Authorization 헤더가 존재하나 토큰이 무효(만료 등) (본문 없음)
        '404':
          description: 해당 공고가 존재하지 않음 (`job posting not found`)
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string

  /categories:
    get:
      operationId: getCategories
      tags: [job-postings]
      summary: 사이트별 직무 카테고리 목록 조회
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: 사이트별 카테고리 목록
          headers:
            Cache-Control:
              description: '`max-age=86400, public`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: './schemas/jobposting.yaml#/components/schemas/CategoriesResponse'
        '401':
          description: Authorization 헤더가 존재하나 토큰이 무효(만료 등) (본문 없음)
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string

  /skills:
    get:
      operationId: getSkills
      tags: [job-postings]
      summary: 기술 스택 목록 조회
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: 기술 스택 목록
          headers:
            Cache-Control:
              description: '`max-age=86400, public`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: './schemas/jobposting.yaml#/components/schemas/SkillsResponse'
        '401':
          description: Authorization 헤더가 존재하나 토큰이 무효(만료 등) (본문 없음)
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string

  /companies:
    get:
      operationId: getCompanies
      tags: [job-postings]
      summary: 회사명 prefix 검색 (최대 5건)
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: true
          description: 회사명 prefix 검색어. 빈 값이면 400 (`keyword is required`)
          schema:
            type: string
      responses:
        '200':
          description: 회사 목록
          headers:
            Cache-Control:
              description: '`max-age=43200, public`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: './schemas/jobposting.yaml#/components/schemas/CompaniesResponse'
        '400':
          description: 요청 파라미터 불량 (본문은 오류 메시지)
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Authorization 헤더가 존재하나 토큰이 무효(만료 등) (본문 없음)
        '500':
          description: 서버 내부 오류 (`Internal Server Error`)
          content:
            text/plain:
              schema:
                type: string
